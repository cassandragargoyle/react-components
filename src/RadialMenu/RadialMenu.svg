<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- RadialMenu visual reference (VS Code dark theme), the GraphLens3D node menu with Filter expanded -->
  <!-- Geometry and colors mirror RadialMenu.tsx (hub 32, ring 1 to 96, ring gap 60) and RadialMenu.css -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Host surface under the transparent overlay (a graph viewport) -->
  <rect x="0" y="0" width="900" height="520" fill="#1e1e1e"/>
  <g stroke="#2a2f37" fill="none">
    <line x1="70" y1="90" x2="160" y2="40"/>
    <line x1="70" y1="90" x2="60" y2="420"/>
    <line x1="520" y1="60" x2="470" y2="140"/>
    <line x1="520" y1="470" x2="420" y2="490"/>
  </g>
  <g fill="#2a2f37">
    <circle cx="70" cy="90" r="9"/><circle cx="160" cy="40" r="6"/><circle cx="60" cy="420" r="7"/>
    <circle cx="520" cy="60" r="8"/><circle cx="470" cy="140" r="5"/><circle cx="520" cy="470" r="9"/><circle cx="420" cy="490" r="5"/>
  </g>

  <!-- ============ Menu, centered on the right-click point ============ -->
  <g filter="url(#shadow)">
    <!-- ring 2: children of Filter, full circle in three segments; Search highlighted -->
    <!-- ring 1: four actions clockwise from the top; Forward disabled -->
    <path d="M 300.0 94.0 A 156 156 0 0 1 435.1 328.0 L 386.6 300.0 A 100 100 0 0 0 300.0 150.0 Z" fill="#252526" stroke="#454545"/>
    <path d="M 435.1 328.0 A 156 156 0 0 1 164.9 328.0 L 213.4 300.0 A 100 100 0 0 0 386.6 300.0 Z" fill="#0e639c" stroke="#454545"/>
    <path d="M 164.9 328.0 A 156 156 0 0 1 300.0 94.0 L 300.0 150.0 A 100 100 0 0 0 213.4 300.0 Z" fill="#252526" stroke="#454545"/>
    <path d="M 300.0 154.0 A 96 96 0 0 1 396.0 250.0 L 336.0 250.0 A 36 36 0 0 0 300.0 214.0 Z" fill="#252526" stroke="#454545"/>
    <path d="M 396.0 250.0 A 96 96 0 0 1 300.0 346.0 L 300.0 286.0 A 36 36 0 0 0 336.0 250.0 Z" fill="#252526" stroke="#454545"/>
    <path d="M 300.0 346.0 A 96 96 0 0 1 204.0 250.0 L 264.0 250.0 A 36 36 0 0 0 300.0 286.0 Z" fill="#252526" stroke="#454545"/>
    <path d="M 204.0 250.0 A 96 96 0 0 1 300.0 154.0 L 300.0 214.0 A 36 36 0 0 0 264.0 250.0 Z" fill="#252526" stroke="#454545" opacity="0.3"/>
    <!-- hub: the primary action (Focus), icon only -->
    <circle cx="300" cy="250" r="32" fill="#0e639c" stroke="#454545"/>
  </g>
  <g color="#ffffff" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" transform="translate(292,242)">
    <circle cx="8" cy="8" r="3"/><path d="M8 1 V4 M8 12 V15 M1 8 H4 M12 8 H15"/>
  </g>

  <!-- Segment labels: monochrome icon + text, › marks a segment with children -->
    <g color="#cccccc" opacity="1">
      <g transform="translate(402.9,170.5)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8 C3 4 13 4 15 8 C13 12 3 12 1 8 Z"/><circle cx="8" cy="8" r="1.8"/><path d="M3 13 L13 3"/></g>
      <text x="410.9" y="199.0" fill="currentColor" font-size="11" text-anchor="middle">Hide</text>
    </g>
    <g color="#ffffff" opacity="1">
      <g transform="translate(292.0,362.5)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4"/><path d="M10 10 L14 14"/></g>
      <text x="300.0" y="391.0" fill="currentColor" font-size="11" text-anchor="middle">Search</text>
    </g>
    <g color="#cccccc" opacity="1">
      <g transform="translate(181.1,170.5)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8 C3 4 13 4 15 8 C13 12 3 12 1 8 Z"/><circle cx="8" cy="8" r="1.8"/></g>
      <text x="189.1" y="199.0" fill="currentColor" font-size="11" text-anchor="middle">Show all</text>
    </g>
    <g color="#cccccc" opacity="1">
      <g transform="translate(338.7,187.8)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="1.6" fill="currentColor" stroke="none"/></g>
      <text x="346.7" y="216.3" fill="currentColor" font-size="11" text-anchor="middle">Isolate</text>
    </g>
    <g color="#cccccc" opacity="1">
      <g transform="translate(338.7,274.2)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3 H14 L9.5 8.5 V13 L6.5 14 V8.5 Z"/></g>
      <text x="346.7" y="302.7" fill="currentColor" font-size="11" text-anchor="middle">Filter</text>
      <text x="346.7" y="316.2" fill="#858585" font-size="12" text-anchor="middle">›</text>
    </g>
    <g color="#cccccc" opacity="1">
      <g transform="translate(245.3,281.2)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 L5 8 L10 13"/></g>
      <text x="253.3" y="309.7" fill="currentColor" font-size="11" text-anchor="middle">Back</text>
    </g>
    <g color="#cccccc" opacity="0.4">
      <g transform="translate(245.3,187.8)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3 L11 8 L6 13"/></g>
      <text x="253.3" y="216.3" fill="currentColor" font-size="11" text-anchor="middle">Forward</text>
    </g>

  <!-- Pointer over the active segment -->
  <path d="M346,342 L346,360 L350.5,355.5 L353.5,362.5 L356.5,361 L353.5,354.5 L359.5,354.5 Z" fill="#ffffff" stroke="#000000" stroke-width="1"/>

  <!-- Tooltip of the active target, centered below the menu -->
  <rect x="240" y="416" width="120" height="22" rx="4" fill="#252526" stroke="#454545"/>
  <text x="300" y="431" fill="#cccccc" font-size="11" text-anchor="middle">Search for "VoS"</text>

  <!-- ============ Callouts ============ -->
  <g stroke="#585858" stroke-dasharray="3 3" fill="none">
    <line x1="332" y1="250" x2="600" y2="250"/>
    <line x1="370" y1="190" x2="600" y2="160"/>
    <line x1="405" y1="160" x2="600" y2="70"/>
    <line x1="350" y1="350" x2="600" y2="340"/>
    <line x1="360" y1="427" x2="600" y2="430"/>
  </g>
  <g font-size="12">
    <text x="610" y="66" fill="#cccccc" font-weight="600">Nested ring</text>
    <text x="610" y="82" fill="#858585">children of Filter, open on hover</text>
    <text x="610" y="156" fill="#cccccc" font-weight="600">Ring 1</text>
    <text x="610" y="172" fill="#858585">actions, clockwise from the top</text>
    <text x="610" y="246" fill="#cccccc" font-weight="600">Hub</text>
    <text x="610" y="262" fill="#858585">primary action, at the anchor point</text>
    <text x="610" y="336" fill="#cccccc" font-weight="600">Active segment</text>
    <text x="610" y="352" fill="#858585">click or release commits a leaf</text>
    <text x="610" y="426" fill="#cccccc" font-weight="600">Tooltip</text>
    <text x="610" y="442" fill="#858585">tooltip, or label when none is set</text>
  </g>
  <text x="610" y="490" fill="#585858" font-size="11">Arrows cycle and expand, ← and Esc step back</text>
</svg>
