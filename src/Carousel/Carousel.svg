<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- Carousel visual reference (VS Code dark theme), three-card fan over the dimmed host -->
  <!-- Cards drawn opaque, standing in for the backdrop blur -->
  <!-- Mirrors Carousel.css: center 220px, neighbors 180px at scale 0.85, ±180px, +16px, 70 % opacity -->
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="shadowSm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Host app underneath (an editor window) -->
