<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620">
  <defs>
    <style>
      .bg { fill: #1e1e1e; }
      .card-bg { fill: #252526; }
      .card-border { stroke: #3c3c3c; fill: none; stroke-width: 1; }
      .separator { stroke: #3c3c3c; stroke-width: 1; }
      .text { fill: #cccccc; font-family: 'Segoe UI', sans-serif; }
      .text-dim { fill: #858585; font-family: 'Segoe UI', sans-serif; }
      .text-err { fill: #f48771; font-family: 'Segoe UI', sans-serif; }
      .title { fill: #858585; font-family: 'Segoe UI', sans-serif; font-weight: 600; letter-spacing: 0.6px; }
      /* Vector step icons (font-independent, monochrome per state) */
      .ic-check { stroke: #73c991; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .ic-active { fill: #0e70c0; }
      .ic-pending { stroke: #858585; fill: none; stroke-width: 1.2; }
      .ic-cross { stroke: #f48771; fill: none; stroke-width: 1.6; stroke-linecap: round; }
      .spinner-ring { stroke: #0e70c0; fill: none; stroke-width: 3; stroke-linecap: round; }
      .err-box { fill: rgba(190,17,0,0.15); stroke: #be1100; stroke-width: 1; }
      .annotation { fill: #75beff; font-family: 'Segoe UI', sans-serif; }
      .ann-line { stroke: #75beff; stroke-width: 1; stroke-dasharray: 3,3; }
    </style>
    <radialGradient id="nucleus" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#6cb6ff"/>
      <stop offset="70%" stop-color="#0e70c0"/>
    </radialGradient>
    <radialGradient id="electron" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#b8d6ff"/>
    </radialGradient>
    <!-- Reusable step-state icons, drawn around local (0,0) -->
    <g id="ic-done"><path class="ic-check" d="M-3.5 0 l2.3 2.6 l4.5 -5.4"/></g>
    <g id="ic-doing"><circle class="ic-active" cx="0" cy="0" r="3.2"/></g>
    <g id="ic-todo"><circle class="ic-pending" cx="0" cy="0" r="3.2"/></g>
    <g id="ic-fail"><path class="ic-cross" d="M-3.2 -3.2 L3.2 3.2 M3.2 -3.2 L-3.2 3.2"/></g>
  </defs>

  <!-- Background -->
  <rect class="bg" width="820" height="620"/>

  <!-- ============================================================ -->
  <!-- LEFT CARD — loading state (spinner + fields + steps)         -->
  <!-- ============================================================ -->
  <g transform="translate(30, 40)">
    <rect x="3" y="3" width="360" height="290" rx="6" fill="rgba(0,0,0,0.35)"/>
    <rect class="card-bg" x="0" y="0" width="360" height="290" rx="6"/>
    <rect class="card-border" x="0" y="0" width="360" height="290" rx="6"/>

    <!-- Head: spinner ring + title + message -->
    <g transform="translate(34, 40)">
      <circle class="spinner-ring" cx="0" cy="0" r="11" stroke-dasharray="42 18"/>
    </g>
    <text class="title" font-size="11" x="60" y="34">PILOT HARNESS</text>
    <text class="text" font-size="14" x="60" y="52">Connecting to gRPC backend&#8230;</text>

    <!-- Fields (bordered top) -->
    <line x1="20" y1="72" x2="340" y2="72" class="separator"/>
    <text class="text-dim" font-size="11" x="20" y="92">ENDPOINT</text>
    <text class="text" font-size="12" x="110" y="92">127.0.0.1:50051</text>
    <text class="text-dim" font-size="11" x="20" y="110">MODE</text>
    <text class="text" font-size="12" x="110" y="110">thin-client (Electron)</text>

    <!-- Steps checklist -->
    <use href="#ic-done"  x="28" y="136"/>
    <text class="text"     font-size="12" x="44" y="140">Load pilot configuration</text>

    <use href="#ic-done"  x="28" y="158"/>
    <text class="text"     font-size="12" x="44" y="162">Spawn helper process</text>

    <use href="#ic-doing" x="28" y="180"/>
    <text class="text"     font-size="12" x="44" y="184">Open gRPC channel</text>

    <use href="#ic-todo"  x="28" y="202"/>
    <text class="text-dim" font-size="12" x="44" y="206">Handshake / capabilities</text>

    <use href="#ic-todo"  x="28" y="224"/>
    <text class="text-dim" font-size="12" x="44" y="228">Ready</text>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT CARD — error state (fail icon + error box)             -->
  <!-- ============================================================ -->
  <g transform="translate(430, 40)">
    <rect x="3" y="3" width="360" height="250" rx="6" fill="rgba(0,0,0,0.35)"/>
    <rect class="card-bg" x="0" y="0" width="360" height="250" rx="6"/>
    <rect class="card-border" x="0" y="0" width="360" height="250" rx="6"/>

    <!-- Head: fail icon + title + error message -->
    <g transform="translate(34, 40)">
      <path class="ic-cross" stroke-width="2" d="M-6 -6 L6 6 M6 -6 L-6 6"/>
    </g>
    <text class="title" font-size="11" x="60" y="34">PILOT HARNESS</text>
    <text class="text-err" font-size="14" x="60" y="52">Backend unavailable</text>

    <!-- Steps up to the failure -->
    <line x1="20" y1="72" x2="340" y2="72" class="separator"/>
    <use href="#ic-done" x="28" y="90"/>
    <text class="text"    font-size="12" x="44" y="94">Load pilot configuration</text>

    <use href="#ic-done" x="28" y="112"/>
    <text class="text"    font-size="12" x="44" y="116">Spawn helper process</text>

    <use href="#ic-fail" x="28" y="134"/>
    <text class="text-err" font-size="12" x="44" y="138">Open gRPC channel</text>

    <!-- Error box -->
    <rect class="err-box" x="20" y="154" width="320" height="72" rx="4"/>
    <text class="text"     font-size="12" x="32" y="178">connect ECONNREFUSED 127.0.0.1:50051</text>
    <text class="text-dim" font-size="11" x="32" y="200">Is the Portunix daemon running?</text>
    <text class="text-dim" font-size="11" x="32" y="216">Start it with:  portunix pilot serve</text>
  </g>

  <!-- ============================================================ -->
  <!-- SPINNER VARIANTS legend                                      -->
  <!-- ============================================================ -->
  <g transform="translate(430, 320)">
    <text class="title" font-size="11" x="0" y="0">SPINNER VARIANTS</text>

    <!-- braille (default), drawn as a partial ring -->
    <g transform="translate(22, 30)">
      <circle class="spinner-ring" cx="0" cy="0" r="11" stroke-dasharray="42 18"/>
    </g>
    <text class="text"     font-size="13" x="52" y="26">spinner='braille'</text>
    <text class="text-dim" font-size="11" x="52" y="42">default &#8212; rotating ora/npm-style snake</text>

    <!-- orbit -->
    <g transform="translate(0, 62)">
      <g transform="translate(22, 22)">
        <ellipse cx="0" cy="0" rx="18" ry="6" fill="none" stroke="#3c3c3c" stroke-width="1"/>
        <circle cx="0" cy="0" r="7" fill="url(#nucleus)"/>
        <circle cx="18" cy="0" r="4.5" fill="url(#electron)"/>
      </g>
      <text class="text"     font-size="13" x="52" y="18">spinner='orbit'</text>
      <text class="text-dim" font-size="11" x="52" y="34">electron orbiting a nucleus (CSS 3D)</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- ANNOTATIONS                                                  -->
  <!-- ============================================================ -->

  <!-- Head -->
  <text class="annotation" font-size="10" x="30" y="360">.progress-panel-head</text>
  <text class="annotation" font-size="9"  x="30" y="372">spinner/fail icon + title + message</text>
  <line x1="60" y1="82" x2="60" y2="352" class="ann-line"/>

  <!-- Fields -->
  <text class="annotation" font-size="10" x="30" y="398">.progress-panel-fields</text>
  <text class="annotation" font-size="9"  x="30" y="410">optional key/value detail rows</text>
  <line x1="150" y1="140" x2="150" y2="390" class="ann-line"/>

  <!-- Steps -->
  <text class="annotation" font-size="10" x="30" y="436">.progress-panel-steps</text>
  <text class="annotation" font-size="9"  x="30" y="448">states: done / active / pending / error</text>
  <line x1="200" y1="224" x2="200" y2="428" class="ann-line"/>

  <!-- Error box -->
  <text class="annotation" font-size="10" x="430" y="470">.progress-panel-error</text>
  <text class="annotation" font-size="9"  x="430" y="482">shown when the `error` prop is set; optional `hint`</text>
  <line x1="590" y1="300" x2="590" y2="462" class="ann-line"/>

  <!-- Title -->
  <text class="annotation" font-size="11" font-weight="600" text-anchor="middle" x="410" y="600">ProgressPanel &#8212; Current State (pilot-ui v0.1.1)</text>
</svg>
