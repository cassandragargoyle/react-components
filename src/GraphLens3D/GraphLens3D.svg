<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- GraphLens3D visual reference (VS Code dark theme), a tag node selected -->
  <!-- Mirrors GraphLens3D.css, the viewport palette in GraphLens3DViewport.tsx and types.ts -->
  <defs>
    <!-- Lit spheres, as the Three.js nodes render -->
    <radialGradient id="sWhite" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.3">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b8bcc4"/>
    </radialGradient>
    <radialGradient id="sBlue" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.3">
      <stop offset="0" stop-color="#a9d0ff"/><stop offset="0.55" stop-color="#58a6ff"/><stop offset="1" stop-color="#2b5f99"/>
    </radialGradient>
    <radialGradient id="sGreen" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.3">
      <stop offset="0" stop-color="#9be3a7"/><stop offset="0.55" stop-color="#3fb950"/><stop offset="1" stop-color="#1f6a2a"/>
    </radialGradient>
    <radialGradient id="sRed" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.3">
      <stop offset="0" stop-color="#ffaaa5"/><stop offset="0.55" stop-color="#f85149"/><stop offset="1" stop-color="#8f2722"/>
    </radialGradient>
    <radialGradient id="sPurple" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.3">
      <stop offset="0" stop-color="#e2cfff"/><stop offset="0.55" stop-color="#bc8cff"/><stop offset="1" stop-color="#6a4a99"/>
    </radialGradient>
    <radialGradient id="sDim" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.3">
      <stop offset="0" stop-color="#3a414b"/><stop offset="1" stop-color="#22262d"/>
    </radialGradient>
  </defs>

  <!-- Root background (editor) -->
  <rect x="0" y="0" width="1200" height="760" fill="#1e1e1e"/>

  <!-- ============ Header (32px, meta.title) ============ -->
  <rect x="0" y="0" width="1200" height="32" fill="#252526"/>
  <line x1="0" y1="32" x2="1200" y2="32" stroke="#3c3c3c"/>
  <text x="12" y="21" fill="#cccccc" font-size="13" font-weight="600">Voice of X — Requirements map</text>

  <!-- ============ 3D viewport (#1e1e1e), selection highlighting ============ -->
  <!-- Dimmed links (#22262d) between nodes outside the selection -->
  <g stroke="#2a2f37" stroke-width="1" fill="none">
    <line x1="330" y1="250" x2="300" y2="140"/>
    <line x1="330" y1="250" x2="440" y2="200"/>
    <line x1="330" y1="250" x2="360" y2="480"/>
    <line x1="470" y1="110" x2="600" y2="160"/>
    <line x1="840" y1="120" x2="700" y2="190"/>
    <line x1="840" y1="120" x2="870" y2="260"/>
    <line x1="870" y1="260" x2="760" y2="300"/>
    <line x1="820" y1="460" x2="680" y2="420"/>
    <line x1="820" y1="460" x2="780" y2="520"/>
    <line x1="650" y1="500" x2="520" y2="440"/>
    <line x1="360" y1="480" x2="430" y2="370"/>
    <line x1="650" y1="500" x2="780" y2="520"/>
    <!-- "related" voice links curve (curvature 0.3) -->
    <path d="M430,370 Q450,450 520,440"/>
    <path d="M700,190 Q770,220 760,300"/>
  </g>

  <!-- Highlighted links of the selection (#ffd166, width 1.2) -->
  <g stroke="#ffd166" stroke-width="1.6" stroke-opacity="0.75" fill="none">
    <line x1="560" y1="300" x2="440" y2="200"/>
    <line x1="560" y1="300" x2="700" y2="190"/>
    <line x1="560" y1="300" x2="430" y2="370"/>
    <line x1="560" y1="300" x2="680" y2="420"/>
    <line x1="560" y1="300" x2="760" y2="300"/>
    <line x1="560" y1="300" x2="520" y2="440"/>
    <line x1="560" y1="300" x2="600" y2="160"/>
  </g>

  <!-- Dimmed nodes (#2a2f37), far ones smaller -->
  <g fill="url(#sDim)">
    <circle cx="330" cy="250" r="11"/>
    <circle cx="300" cy="140" r="6"/>
    <circle cx="470" cy="110" r="7"/>
    <circle cx="840" cy="120" r="12"/>
    <circle cx="870" cy="260" r="7"/>
    <circle cx="820" cy="460" r="10"/>
    <circle cx="780" cy="520" r="6"/>
    <circle cx="650" cy="500" r="8"/>
    <circle cx="360" cy="480" r="9"/>
    <circle cx="280" cy="380" r="5"/>
    <circle cx="890" cy="380" r="5"/>
    <circle cx="560" cy="80" r="4"/>
    <circle cx="460" cy="520" r="5"/>
  </g>

  <!-- Neighbors of the selection keep their kind color -->
  <circle cx="440" cy="200" r="10" fill="url(#sBlue)"/>
  <circle cx="700" cy="190" r="9" fill="url(#sBlue)"/>
  <circle cx="430" cy="370" r="11" fill="url(#sGreen)"/>
  <circle cx="680" cy="420" r="8" fill="url(#sGreen)"/>
  <circle cx="760" cy="300" r="10" fill="url(#sPurple)"/>
  <circle cx="520" cy="440" r="10" fill="url(#sRed)"/>
  <circle cx="600" cy="160" r="7" fill="url(#sRed)"/>

  <!-- Selected node renders white, sized by degree -->
  <circle cx="560" cy="300" r="17" fill="url(#sWhite)"/>

  <!-- Hover tooltip (nodeLabel: title || label || id) -->
  <rect x="376" y="384" width="236" height="22" rx="3" fill="#000000" fill-opacity="0.7"/>
  <text x="384" y="399" fill="#ffffff" font-size="11">Customer can sign in with a company account</text>

  <!-- ============ Overlay toolbar (left, 230px) ============ -->
  <!-- nav: previous / next selection -->
  <rect x="8" y="40" width="34" height="24" rx="4" fill="#252526" stroke="#3c3c3c"/>
  <text x="25" y="56" fill="#cccccc" font-size="11" text-anchor="middle">◀</text>
  <rect x="48" y="40" width="34" height="24" rx="4" fill="#252526" stroke="#3c3c3c" opacity="0.4"/>
  <text x="65" y="56" fill="#cccccc" font-size="11" text-anchor="middle" opacity="0.4">▶</text>

  <!-- search -->
  <rect x="8" y="72" width="230" height="30" rx="4" fill="#3c3c3c" stroke="#3c3c3c"/>
  <text x="18" y="91" fill="#858585" font-size="13">Search nodes...</text>

  <!-- kind filters: checkbox + swatch + kind -->
  <rect x="8" y="110" width="230" height="56" rx="4" fill="#252526" stroke="#3c3c3c"/>
  <g font-size="12" fill="#858585">
    <g transform="translate(18,118)">
      <rect width="13" height="13" rx="2" fill="#0e639c"/><path d="M3,6.5 L5.5,9 L10,4" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <circle cx="22.5" cy="6.5" r="4.5" fill="#d29922"/><text x="32" y="11">tag</text>
    </g>
    <g transform="translate(88,118)">
      <rect width="13" height="13" rx="2" fill="#0e639c"/><path d="M3,6.5 L5.5,9 L10,4" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <circle cx="22.5" cy="6.5" r="4.5" fill="#58a6ff"/><text x="32" y="11">VoB</text>
    </g>
    <g transform="translate(162,118)">
      <rect width="13" height="13" rx="2" fill="#0e639c"/><path d="M3,6.5 L5.5,9 L10,4" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <circle cx="22.5" cy="6.5" r="4.5" fill="#3fb950"/><text x="32" y="11">VoC</text>
    </g>
    <g transform="translate(18,142)">
      <rect width="13" height="13" rx="2" fill="#0e639c"/><path d="M3,6.5 L5.5,9 L10,4" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <circle cx="22.5" cy="6.5" r="4.5" fill="#bc8cff"/><text x="32" y="11">VoE</text>
