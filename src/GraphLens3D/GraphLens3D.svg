    <text x="932" y="124" fill="#858585" font-size="11">Connections</text><text x="1188" y="124" fill="#cccccc" text-anchor="end">7</text>
  </g>
  <line x1="920" y1="136" x2="1200" y2="136" stroke="#3c3c3c"/>
  <!-- description -->
