  <text x="18" y="212" fill="#858585" font-size="10" letter-spacing="0.5">LINES</text>
  <line x1="20" y1="228" x2="46" y2="228" stroke="#9aa4af" stroke-width="2"/>
  <text x="56" y="232" fill="#cccccc" font-size="12">hub → voice</text>
  <path d="M20,252 Q33,242 46,252" fill="none" stroke="#fb923c" stroke-width="2"/>
