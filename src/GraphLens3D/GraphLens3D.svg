  <text x="932" y="176" fill="#cccccc" font-size="12">Authentication, authorisation and</text>
  <text x="932" y="194" fill="#cccccc" font-size="12">audit requirements across voices.</text>
  <line x1="920" y1="206" x2="1200" y2="206" stroke="#3c3c3c"/>
  <!-- meta -->
  <text x="932" y="226" fill="#858585" font-size="11" font-weight="600" letter-spacing="0.5">META</text>
  <g font-size="12">
    <text x="932" y="246" fill="#858585" font-size="11">owner</text><text x="1188" y="246" fill="#cccccc" text-anchor="end">platform</text>
    <text x="932" y="264" fill="#858585" font-size="11">priority</text><text x="1188" y="264" fill="#cccccc" text-anchor="end">high</text>
    <text x="932" y="282" fill="#858585" font-size="11">updated</text><text x="1188" y="282" fill="#cccccc" text-anchor="end">2026-09-30</text>
  </g>
  <line x1="920" y1="294" x2="1200" y2="294" stroke="#3c3c3c"/>
  <!-- connections: clickable neighbors -->
  <text x="932" y="314" fill="#858585" font-size="11" font-weight="600" letter-spacing="0.5">CONNECTIONS (7)</text>
  <g font-size="12" fill="#cccccc">
    <text x="932" y="334"><tspan fill="#858585" font-size="11">→</tspan> Audit trail for billing</text>
    <text x="932" y="353"><tspan fill="#858585" font-size="11">→</tspan> Role-based pricing tiers</text>
    <text x="932" y="372" fill="#75beff"><tspan fill="#858585" font-size="11">→</tspan> Company sign-in</text>
    <text x="932" y="391"><tspan fill="#858585" font-size="11">→</tspan> Password reset by email</text>
    <text x="932" y="410"><tspan fill="#858585" font-size="11">→</tspan> mTLS between services</text>
    <text x="932" y="429"><tspan fill="#858585" font-size="11">→</tspan> GDPR data retention</text>
    <text x="932" y="448"><tspan fill="#858585" font-size="11">→</tspan> ISO 27001 access review</text>
  </g>
