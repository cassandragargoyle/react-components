  <text x="18" y="286" fill="#858585" font-size="10" letter-spacing="0.5">SELECTED NODE</text>
  <g font-size="12">
    <text x="18" y="306" fill="#858585">Id</text><text x="228" y="306" fill="#cccccc" text-anchor="end">tag-security</text>
    <text x="18" y="324" fill="#858585">Kind</text><text x="228" y="324" fill="#cccccc" text-anchor="end">tag</text>
    <text x="18" y="342" fill="#858585">Degree</text><text x="228" y="342" fill="#cccccc" text-anchor="end">7</text>
    <text x="18" y="360" fill="#858585">VoB Neighbors</text><text x="228" y="360" fill="#cccccc" text-anchor="end">2</text>
    <text x="18" y="378" fill="#858585">VoC Neighbors</text><text x="228" y="378" fill="#cccccc" text-anchor="end">2</text>
    <text x="18" y="396" fill="#858585">VoE Neighbors</text><text x="228" y="396" fill="#cccccc" text-anchor="end">1</text>
    <text x="18" y="414" fill="#858585">VoS Neighbors</text><text x="228" y="414" fill="#cccccc" text-anchor="end">2</text>
  </g>

  <!-- ============ Resize handle (5px) ============ -->
  <rect x="0" y="548" width="920" height="5" fill="#585858"/>

  <!-- ============ Node table (NodeTablePanel, AG Grid) ============ -->
  <rect x="0" y="553" width="920" height="207" fill="#1e1e1e"/>
  <!-- header bar: collapse, All/Selected, count -->
  <rect x="0" y="553" width="920" height="26" fill="#252526"/>
  <line x1="0" y1="579" x2="920" y2="579" stroke="#3c3c3c"/>
  <text x="10" y="573" font-size="17" fill="#cccccc">▾</text>
  <rect x="34" y="558" width="30" height="17" rx="2" fill="#0e639c"/>
  <text x="41" y="570" font-size="10" fill="#ffffff">All</text>
  <text x="74" y="570" font-size="10" fill="#858585">Selected</text>
  <text x="910" y="570" font-size="10" fill="#858585" text-anchor="end">Showing: 21 of 21 nodes</text>
  <!-- column header: ID, Label, Kind, Degree, then the meta keys -->
  <rect x="0" y="579" width="920" height="26" fill="#2d2d2d"/>
  <rect x="0" y="603" width="920" height="2" fill="#007fd4"/>
  <g font-size="9" font-weight="600" letter-spacing="0.5" fill="#cccccc">
    <text x="12" y="596">ID</text>
    <text x="132" y="596">LABEL</text>
    <text x="352" y="596">KIND</text>
    <text x="452" y="596">DEGREE</text>
    <text x="542" y="596">OWNER</text>
    <text x="662" y="596">PRIORITY</text>
    <text x="782" y="596">UPDATED</text>
  </g>
  <!-- rows (26px); the selected node row is highlighted -->
  <g font-size="10" fill="#cccccc">
    <text x="12" y="622">tag-auth</text><text x="132" y="622">authentication</text>
    <circle cx="356" cy="618" r="4.5" fill="#d29922"/><text x="365" y="622">tag</text>
    <text x="452" y="622">5</text><text x="542" y="622">platform</text><text x="662" y="622">high</text><text x="782" y="622">2026-09-12</text>
    <line x1="0" y1="631" x2="920" y2="631" stroke="#3c3c3c"/>

    <rect x="0" y="631" width="920" height="26" fill="#094771"/>
    <text x="12" y="648">tag-security</text><text x="132" y="648">security</text>
    <circle cx="356" cy="644" r="4.5" fill="#d29922"/><text x="365" y="648">tag</text>
    <text x="452" y="648">7</text><text x="542" y="648">platform</text><text x="662" y="648">high</text><text x="782" y="648">2026-09-30</text>
    <line x1="0" y1="657" x2="920" y2="657" stroke="#3c3c3c"/>

    <text x="12" y="674">voc-sso</text><text x="132" y="674">Company sign-in</text>
    <circle cx="356" cy="670" r="4.5" fill="#3fb950"/><text x="365" y="674">VoC</text>
    <text x="452" y="674">3</text><text x="542" y="674">product</text><text x="662" y="674">high</text><text x="782" y="674">2026-08-21</text>
    <line x1="0" y1="683" x2="920" y2="683" stroke="#3c3c3c"/>

    <text x="12" y="700">vob-audit</text><text x="132" y="700">Audit trail for billing</text>
    <circle cx="356" cy="696" r="4.5" fill="#58a6ff"/><text x="365" y="700">VoB</text>
    <text x="452" y="700">2</text><text x="542" y="700">finance</text><text x="662" y="700">medium</text><text x="782" y="700">2026-07-04</text>
    <line x1="0" y1="709" x2="920" y2="709" stroke="#3c3c3c"/>

    <text x="12" y="726">vos-gdpr</text><text x="132" y="726">GDPR data retention</text>
    <circle cx="356" cy="722" r="4.5" fill="#f85149"/><text x="365" y="726">VoS</text>
    <text x="452" y="726">4</text><text x="542" y="726">legal</text><text x="662" y="726">high</text><text x="782" y="726">2026-09-02</text>
    <line x1="0" y1="735" x2="920" y2="735" stroke="#3c3c3c"/>

    <text x="12" y="752">voe-mtls</text><text x="132" y="752">mTLS between services</text>
    <circle cx="356" cy="748" r="4.5" fill="#bc8cff"/><text x="365" y="752">VoE</text>
    <text x="452" y="752">2</text><text x="542" y="752">platform</text><text x="662" y="752">medium</text><text x="782" y="752">2026-06-18</text>
  </g>

  <!-- ============ Detail panel (right, 280px) ============ -->
  <rect x="920" y="32" width="280" height="728" fill="#252526"/>
  <line x1="920" y1="32" x2="920" y2="760" stroke="#3c3c3c"/>
  <!-- header: kind badge + label -->
