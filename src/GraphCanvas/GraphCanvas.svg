<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="'Segoe UI', system-ui, sans-serif">
  <!-- GraphCanvas visual appearance mockup (VS Code dark theme) -->
  <!-- Mirrors buildStylesheet() in GraphViewport.tsx and GraphCanvas.css -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555555"/>
    </marker>
    <marker id="arrowSel" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#75beff"/>
    </marker>
  </defs>

  <!-- Root background (editor) -->
  <rect x="0" y="0" width="960" height="600" fill="#1e1e1e"/>

  <!-- ============ Toolbar (32px, top) ============ -->
  <rect x="0" y="0" width="960" height="34" fill="#252526"/>
  <line x1="0" y1="34" x2="960" y2="34" stroke="#3c3c3c" stroke-width="1"/>
  <!-- zoom group -->
  <rect x="10" y="6" width="22" height="22" rx="3" fill="#2d2d2e"/>
  <text x="21" y="21" fill="#cccccc" font-size="12" text-anchor="middle">⤢</text>
  <rect x="36" y="6" width="22" height="22" rx="3" fill="#2d2d2e"/>
  <text x="47" y="21" fill="#cccccc" font-size="13" text-anchor="middle">+</text>
  <rect x="62" y="6" width="22" height="22" rx="3" fill="#2d2d2e"/>
  <text x="73" y="21" fill="#cccccc" font-size="13" text-anchor="middle">−</text>
  <line x1="96" y1="9" x2="96" y2="25" stroke="#3c3c3c" stroke-width="1"/>
  <!-- layout select -->
  <text x="110" y="21" fill="#858585" font-size="11">Layout:</text>
  <rect x="152" y="6" width="170" height="22" rx="2" fill="#3c3c3c" stroke="#3c3c3c"/>
  <text x="160" y="21" fill="#cccccc" font-size="12">Dagre (hierarchical)</text>
  <text x="312" y="21" fill="#858585" font-size="10" text-anchor="middle">▾</text>
  <line x1="334" y1="9" x2="334" y2="25" stroke="#3c3c3c" stroke-width="1"/>
  <!-- find input -->
  <rect x="346" y="7" width="140" height="20" rx="2" fill="#3c3c3c" stroke="#3c3c3c"/>
  <text x="353" y="21" fill="#858585" font-size="12">Find node…</text>
  <!-- status (right) -->
  <text x="950" y="21" fill="#858585" font-size="11" text-anchor="end">5 nodes, 5 edges</text>

  <!-- ============ Right property panel (260px) ============ -->
  <rect x="700" y="34" width="260" height="566" fill="#252526"/>
  <line x1="700" y1="34" x2="700" y2="600" stroke="#3c3c3c" stroke-width="1"/>
  <!-- header -->
  <circle cx="714" cy="56" r="4" fill="#4a9eff"/>
  <text x="726" y="60" fill="#cccccc" font-size="13" font-weight="600">Node: server-01</text>
  <line x1="700" y1="74" x2="960" y2="74" stroke="#3c3c3c" stroke-width="1"/>
  <!-- id/type/label section -->
  <text x="712" y="94" fill="#858585" font-size="11">ID</text>
  <text x="948" y="94" fill="#cccccc" font-size="12" text-anchor="end">server-01</text>
  <text x="712" y="112" fill="#858585" font-size="11">Type</text>
  <text x="948" y="112" fill="#cccccc" font-size="12" text-anchor="end">compute</text>
  <text x="712" y="130" fill="#858585" font-size="11">Label</text>
  <text x="948" y="130" fill="#cccccc" font-size="12" text-anchor="end">Server 01</text>
  <line x1="700" y1="144" x2="960" y2="144" stroke="#3c3c3c" stroke-width="1"/>
  <!-- properties section -->
  <text x="712" y="164" fill="#858585" font-size="11" font-weight="600" letter-spacing="0.5">PROPERTIES</text>
  <text x="712" y="182" fill="#858585" font-size="11">zone</text>
  <text x="948" y="182" fill="#cccccc" font-size="12" text-anchor="end">eu-west-1</text>
  <line x1="700" y1="196" x2="960" y2="196" stroke="#3c3c3c" stroke-width="1"/>
  <!-- connections section -->
  <text x="712" y="216" fill="#858585" font-size="11" font-weight="600" letter-spacing="0.5">CONNECTIONS</text>
  <text x="712" y="236" fill="#858585" font-size="11">→</text>
  <text x="728" y="236" fill="#cccccc" font-size="12">cache <tspan fill="#858585">(reads)</tspan></text>
  <text x="712" y="254" fill="#858585" font-size="11">←</text>
  <text x="728" y="254" fill="#cccccc" font-size="12">db-primary <tspan fill="#858585">(hosts)</tspan></text>
  <text x="712" y="272" fill="#858585" font-size="11">←</text>
  <text x="728" y="272" fill="#cccccc" font-size="12">gateway</text>

  <!-- ============ Center: Viewport ============ -->
  <!-- edges (drawn first, under nodes) -->
  <line x1="170" y1="170" x2="226" y2="270" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="362" y1="168" x2="264" y2="272" stroke="#75beff" stroke-width="3" marker-end="url(#arrowSel)"/>
  <line x1="398" y1="168" x2="448" y2="272" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="222" y1="308" x2="178" y2="366" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="306" x2="190" y2="378" stroke="#555555" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <!-- edge labels -->
  <text x="192" y="216" fill="#858585" font-size="10" text-anchor="middle">hosts</text>
  <text x="470" y="216" fill="#858585" font-size="10" text-anchor="middle">routes</text>
  <text x="300" y="360" fill="#858585" font-size="10" text-anchor="middle">replicates</text>

  <!-- database node (diamond, orange) -->
  <polygon points="160,128 182,150 160,172 138,150" fill="#e6994a" stroke="#cc8833" stroke-width="2"/>
  <text x="160" y="154" fill="#ffffff" font-size="11" text-anchor="middle">db-prim…</text>

  <!-- network node (hexagon, green) -->
  <polygon points="368,130 392,130 404,150 392,170 368,170 356,150" fill="#4ae699" stroke="#33cc77" stroke-width="2"/>
  <text x="380" y="154" fill="#ffffff" font-size="11" text-anchor="middle">gateway</text>

  <!-- compute node SELECTED (round-rect, blue, larger, light-blue border) -->
  <rect x="212" y="272" width="56" height="36" rx="8" fill="#75beff" opacity="0.15"/>
  <rect x="212" y="272" width="56" height="36" rx="8" fill="#4a9eff" stroke="#75beff" stroke-width="3"/>
  <text x="240" y="294" fill="#ffffff" font-size="11" text-anchor="middle">server-01</text>

  <!-- compute node (round-rect, blue) -->
  <rect x="436" y="274" width="48" height="32" rx="8" fill="#4a9eff" stroke="#3a7ecc" stroke-width="2"/>
  <text x="460" y="294" fill="#ffffff" font-size="11" text-anchor="middle">server-02</text>

  <!-- default node (ellipse, blue) -->
  <ellipse cx="160" cy="382" rx="24" ry="18" fill="#4a9eff" stroke="#3a7ecc" stroke-width="2"/>
  <text x="160" y="386" fill="#ffffff" font-size="11" text-anchor="middle">cache</text>

  <!-- ============ Resize handle (5px) ============ -->
  <rect x="0" y="446" width="700" height="5" fill="#585858"/>

  <!-- ============ Node table (NodeTablePanel, ag-grid), bottom of center ============ -->
  <rect x="0" y="451" width="700" height="149" fill="#1e1e1e"/>
  <!-- panel header bar: collapse, All/Selected filter, row count -->
  <rect x="0" y="451" width="700" height="26" fill="#252526"/>
  <line x1="0" y1="477" x2="700" y2="477" stroke="#3c3c3c" stroke-width="1"/>
  <text x="10" y="471" font-size="17" fill="#cccccc">&#9662;</text>
  <rect x="34" y="456" width="30" height="17" rx="2" fill="#0e639c"/>
  <text x="41" y="468" font-size="10" fill="#ffffff">All</text>
  <text x="74" y="468" font-size="10" fill="#858585">Selected</text>
  <text x="690" y="468" font-size="10" fill="#858585" text-anchor="end">Showing: 5 of 5 nodes</text>
  <!-- column header row -->
  <rect x="0" y="477" width="700" height="26" fill="#2d2d2d"/>
  <rect x="0" y="501" width="700" height="2" fill="#007fd4"/>
  <text x="12" y="494" fill="#cccccc" font-size="9" font-weight="600" letter-spacing="0.5">ID</text>
  <text x="140" y="494" fill="#cccccc" font-size="9" font-weight="600" letter-spacing="0.5">LABEL</text>
  <text x="300" y="494" fill="#cccccc" font-size="9" font-weight="600" letter-spacing="0.5">TYPE</text>
  <text x="420" y="494" fill="#cccccc" font-size="9" font-weight="600" letter-spacing="0.5">ZONE</text>
  <line x1="128" y1="477" x2="128" y2="575" stroke="#2b2b2b" stroke-width="1"/>
  <line x1="288" y1="477" x2="288" y2="575" stroke="#2b2b2b" stroke-width="1"/>
  <line x1="408" y1="477" x2="408" y2="575" stroke="#2b2b2b" stroke-width="1"/>
  <!-- selected row (server-01) -->
  <rect x="0" y="503" width="700" height="24" fill="#094771"/>
  <text x="12" y="519" fill="#ffffff" font-size="12">server-01</text>
  <text x="140" y="519" fill="#ffffff" font-size="12">Server 01</text>
  <text x="300" y="519" fill="#ffffff" font-size="12">compute</text>
  <text x="420" y="519" fill="#ffffff" font-size="12">eu-west-1</text>
  <!-- other rows (the grid scrolls for the rest) -->
  <text x="12" y="543" fill="#cccccc" font-size="12">server-02</text>
  <text x="140" y="543" fill="#cccccc" font-size="12">Server 02</text>
  <text x="300" y="543" fill="#cccccc" font-size="12">compute</text>
  <text x="420" y="543" fill="#cccccc" font-size="12">eu-west-1</text>
  <line x1="0" y1="551" x2="700" y2="551" stroke="#2b2b2b" stroke-width="1"/>
  <text x="12" y="567" fill="#cccccc" font-size="12">db-primary</text>
  <text x="140" y="567" fill="#cccccc" font-size="12">DB Primary</text>
  <text x="300" y="567" fill="#cccccc" font-size="12">database</text>
  <text x="420" y="567" fill="#cccccc" font-size="12">eu-west-1</text>
  <line x1="0" y1="575" x2="700" y2="575" stroke="#2b2b2b" stroke-width="1"/>

  <!-- legend caption -->
  <text x="12" y="592" fill="#585858" font-size="10">◆ database  ⬡ network  ▢ compute  ● default   — selected = light-blue (#75beff)</text>
</svg>
