# Publish the @cassandragargoyle/react-components package to GitHub Packages
# Triggered by a v* tag or manual dispatch; the pattern follows portunix-vscode ADR-011/012

name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack without publishing'
        type: boolean
        default: false

# GITHUB_TOKEN needs packages:write to publish to GitHub Packages; contents:read
# is enough for checkout. No personal write:packages PAT required.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@cassandragargoyle'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Tag payload must match package.json (a vX.Y.Z tag that does not match the
      # cut version is a mistake — fail loudly instead of publishing).
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ${{ steps.pkg.outputs.version }}"
            exit 1
          fi

      # Skip publish if this version already exists on the registry so a re-run
      # (or a workflow_dispatch on an unchanged version) does not hard-fail.
      - name: Check if version already published
        id: published
        run: |
          if npm view "@cassandragargoyle/react-components@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.pkg.outputs.version }} already published — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (dry run)
        if: steps.published.outputs.exists == 'false' && inputs.dry_run
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: steps.published.outputs.exists == 'false' && !inputs.dry_run
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
